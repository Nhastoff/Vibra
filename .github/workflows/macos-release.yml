name: macOS and Linux installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Unpack reviewed desktop sources
        run: unzip -q desktop-source-0.1.8.zip -d app
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked build dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Verify server and signed application updates
        working-directory: app
        run: |
          node --test --test-isolation=none test/backend.test.mjs test/update-core.test.mjs
          node -e "if(require('./package.json').version!=='0.1.8')process.exit(1)"
      - name: Prepare Linux runtime sandbox
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Verify update and restart on macOS
        if: runner.os == 'macOS'
        working-directory: app
        run: node scripts/smoke-code-update.mjs
      - name: Verify update and restart on Linux
        if: runner.os == 'Linux'
        working-directory: app
        run: xvfb-run -a node scripts/smoke-code-update.mjs
      - name: Build installers
        working-directory: app
        run: node scripts/build-desktop.mjs ${{ matrix.platform }} --${{ matrix.arch }}
      - name: Launch packaged macOS GUI and SQLite
        if: runner.os == 'macOS'
        working-directory: app
        run: node scripts/smoke-macos.mjs
      - name: Verify Linux DEB and launch packaged GUI
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          node --test test/linux-package.test.mjs
          sudo chown root:root dist/linux-unpacked/chrome-sandbox
          sudo chmod 4755 dist/linux-unpacked/chrome-sandbox
          xvfb-run -a node scripts/smoke-linux.mjs
          node --input-type=module -e "import{readdirSync,renameSync}from'node:fs';const f=readdirSync('dist').filter(n=>n.endsWith('.deb'));if(f.length!==1)throw Error('Expected one DEB');const p='dist/'+f[0];if(p!=='dist/Vibra-0.1.8-linux-amd64.deb')renameSync(p,'dist/Vibra-0.1.8-linux-amd64.deb')"
          dpkg-deb --info dist/Vibra-0.1.8-linux-amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Vibra-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.deb
            app/dist/*.AppImage
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish tested installers to prepared release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd installers
          sha256sum *.dmg *.zip *.deb *.AppImage > SHA256SUMS-native.txt
          gh release upload v0.1.8 *.dmg *.zip *.deb *.AppImage SHA256SUMS-native.txt
